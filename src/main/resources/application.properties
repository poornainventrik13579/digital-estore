# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/digital_estore
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway Configuration (Primary schema management)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server Configuration
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application Configuration
app.base-url=${BASE_URL:http://localhost:8080}
app.version=1.0.0

# Actuator Configuration for Health Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.mail.enabled=true
management.health.db.enabled=true
management.info.env.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.inventrik.digitalestore=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

# Sender information
email.from=${EMAIL_FROM:your-email@gmail.com}
email.sender-name=Digital E-Store

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_your_stripe_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-jwt-secret-key-change-in-production}
jwt.expiration=86400000

# Rate Limiting Configuration
rate-limit.enabled=true
rate-limit.default.requests-per-minute=60
rate-limit.auth.requests-per-minute=5
rate-limit.payment.requests-per-minute=10
rate-limit.admin.requests-per-minute=100

# OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
oauth2.issuer=http://localhost:8080

# Enable form login
spring.security.oauth2.authorization-server.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Swagger UI OAuth2 configuration
springdoc.swagger-ui.oauth2.client-id=swagger-client
springdoc.swagger-ui.oauth2.client-secret=swagger-secret
springdoc.swagger-ui.oauth2.use-basic-authentication-with-access-code-grant=true